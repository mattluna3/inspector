name: CMC Collector

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cmc-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests pandas

      - name: Run CMC collector
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python cmc_collector.py

      - name: Save collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Mantener solo el archive más reciente por tipo (top100 y emerging)
          # El resto se borra para no acumular data en el repo
          if [ -d data/cmc/archives ]; then
            for tipo in top100 emerging; do
              # Lista archivos ordenados por fecha (más reciente primero)
              ls -t data/cmc/archives/${tipo}_*.csv 2>/dev/null | tail -n +2 | xargs rm -f 2>/dev/null || true
            done
          fi

          git add data/cmc/

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
          else
            git commit -m "data: collect CMC market snapshot"
            git pull --rebase origin main
            git push
          fi
