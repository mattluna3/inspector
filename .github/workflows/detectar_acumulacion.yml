name: Detector Acumulación

on:
  schedule:
    - cron: "0 */2 * * *"    # cada 2 horas
  workflow_dispatch:

permissions:
  contents: write

# Mismo grupo que CMC Collector para no chocar en el push
concurrency:
  group: cmc-collector
  cancel-in-progress: false

jobs:
  detectar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Ejecutar detector
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python detectar_acumulacion.py

      - name: Guardar estado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p data/cmc

          for f in data/cmc/acumulacion_state.json data/cmc/acumulacion_log.jsonl; do
            if [ -f "$f" ]; then
              git add -f "$f"
              echo "✅ Añadido: $f"
            fi
          done

          if ! git diff --cached --quiet; then
            git commit -m "data: detector acumulacion [skip ci]"
            git pull --rebase --autostash origin main || true
            git push || (git pull --rebase --autostash origin main && git push)
          else
            echo "Sin cambios"
          fi
